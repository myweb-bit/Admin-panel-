<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SM Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1A1A1A;
            --secondary: #2C2C2C;
            --gold: #D4AF37;
            --danger: #ff4757;
            --success: #2ed573;
            --text: #FDFBF7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--primary); color: var(--text); padding-bottom: 50px; }

        header { background: var(--secondary); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
        .logo { color: var(--gold); font-size: 1.5rem; font-weight: 600; }
        .logout-btn { background: rgba(255,0,0,0.1); color: var(--danger); border: 1px solid var(--danger); padding: 5px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px; }
        .tab-btn { background: var(--secondary); color: white; border: 1px solid #444; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .tab-btn.active { background: var(--gold); color: var(--primary); font-weight: bold; border-color: var(--gold); }

        .panel { display: none; padding: 20px; max-width: 1000px; margin: auto; }
        .panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .upload-card { background: var(--secondary); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 30px; border: 1px solid #333; }
        .upload-card h3 { color: var(--gold); margin-bottom: 20px; font-size: 1.3rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        .form-group input { width: 100%; padding: 12px; background: var(--primary); border: 1px solid #444; color: white; border-radius: 8px; outline: none; }
        .form-group input:focus { border-color: var(--gold); }
        .form-group input[type="file"] { padding: 8px; background: #222; cursor: pointer; }
        
        .submit-btn { width: 100%; background: var(--gold); color: var(--primary); font-weight: 600; font-size: 1.1rem; padding: 12px; border: none; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .submit-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

        .grid-header { font-size: 1.2rem; margin-bottom: 15px; color: var(--gold); border-bottom: 1px solid #444; padding-bottom: 10px; }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .data-card { background: var(--secondary); border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .data-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #444; }
        .data-card-info { padding: 15px; }
        .data-card-info h4 { font-size: 1rem; margin-bottom: 5px; }
        .data-card-info p { color: var(--gold); font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; }
        .delete-btn { width: 100%; background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast.error { background-color: var(--danger); }

        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 20px; height: 20px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="deleteSound" src="https://assets.mixkit.co/active_storage/sfx/238/238-preview.mp3"></audio>

    <header>
        <div class="logo">👑 SM Admin Panel</div>
        <button class="logout-btn" onclick="alert('System Locked!')">Lock</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('services')">📋 Manage Services</button>
        <button class="tab-btn" onclick="switchTab('gallery')">🖼️ Manage Gallery</button>
    </div>

    <!-- SERVICES PANEL -->
    <div id="services-panel" class="panel active">
        <div class="upload-card">
            <h3>Add New Service (कैटलॉग में सर्विस जोड़ें)</h3>
            <div class="form-group">
                <label>Select Photo (फोटो चुनें)</label>
                <!-- accept="image/*" makes sure they can pick any image type -->
                <input type="file" id="srv-image" accept="image/*">
            </div>
            <div class="form-group">
                <label>Service Name (सर्विस का नाम)</label>
                <input type="text" id="srv-title" placeholder="e.g. DJ & Sound Setup">
            </div>
            <div class="form-group">
                <label>Price (दाम)</label>
                <input type="text" id="srv-price" placeholder="e.g. ₹40,000/-">
            </div>
            <button class="submit-btn" id="srv-btn" onclick="uploadService()">
                <div class="spinner" id="srv-spinner"></div>
                <span id="srv-btn-text">Upload & Publish</span>
            </button>
        </div>

        <h3 class="grid-header">Current Services Live on Website</h3>
        <div class="data-grid" id="live-services"></div>
    </div>

    <!-- GALLERY PANEL -->
    <div id="gallery-panel" class="panel">
        <div class="upload-card">
            <h3>Add Gallery Photo (गैलरी में फोटो जोड़ें)</h3>
            <div class="form-group">
                <label>Select Photo (फोटो चुनें)</label>
                <input type="file" id="gal-image" accept="image/*">
            </div>
            <div class="form-group">
                <label>Photo Title (फोटो का टाइटल)</label>
                <input type="text" id="gal-title" placeholder="e.g. Royal Stage Decoration">
            </div>
            <button class="submit-btn" id="gal-btn" onclick="uploadGallery()">
                <div class="spinner" id="gal-spinner"></div>
                <span id="gal-btn-text">Upload to Gallery</span>
            </button>
        </div>

        <h3 class="grid-header">Current Gallery Photos</h3>
        <div class="data-grid" id="live-gallery"></div>
    </div>

    <div id="toast">Message</div>

    <!-- Firebase SDK (REALTIME DATABASE INCLUDED) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ========================================================
        // 🔑 YOUR API KEY IS SET HERE AUTOMATICALLY
        // ========================================================
        const IMGBB_API_KEY = "8104f8ac745d8dc4621b9d758844b418"; 
        
        // Firebase Realtime Database Config
        const firebaseConfig = {
            apiKey: "AIzaSyB4TpCv-euqVOn7W_7DBPkp0AsXhkJjmk8",
            authDomain: "photoshutter-423ab.firebaseapp.com",
            databaseURL: "https://photoshutter-423ab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "photoshutter-423ab",
            storageBucket: "photoshutter-423ab.firebasestorage.app",
            messagingSenderId: "666430892267",
            appId: "1:666430892267:web:ea1167d5ce6a6bb1b3b6ae"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); // REALTIME DATABASE CONNECTED

        const soundSuccess = document.getElementById('successSound');
        const soundDelete = document.getElementById('deleteSound');

        function switchTab(tabName) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`${tabName}-panel`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = isError ? "show error" : "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        }

        // 2. STRONG VALIDATION UPLOAD FUNCTION
        async function uploadImageToImgBB(file) {
            if (!IMGBB_API_KEY || IMGBB_API_KEY.trim() === "") {
                throw new Error("❌ API Key missing!");
            }

            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if(data.success) {
                    return data.data.url;
                } else {
                    throw new Error(data.error.message || "ImgBB Upload Failed!");
                }
            } catch (err) {
                throw new Error("Network Error! " + err.message);
            }
        }

        async function uploadService() {
            const fileInput = document.getElementById('srv-image');
            const titleInput = document.getElementById('srv-title').value.trim();
            const priceInput = document.getElementById('srv-price').value.trim();
            const btn = document.getElementById('srv-btn');
            const spinner = document.getElementById('srv-spinner');
            const btnText = document.getElementById('srv-btn-text');

            if(!fileInput.files[0] || !titleInput || !priceInput) {
                showToast("Please fill all details and select an image!", true);
                return;
            }

            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Uploading to Server...";

            try {
                const imageUrl = await uploadImageToImgBB(fileInput.files[0]);
                
                btnText.innerText = "Saving to Realtime Database...";
                // REALTIME DATABASE PUSH
                await db.ref('sm_events_services').push({
                    title: titleInput,
                    price: priceInput,
                    imageUrl: imageUrl,
                    timestamp: Date.now()
                });

                soundSuccess.play();
                showToast("✅ Service added successfully!");
                fileInput.value = ""; document.getElementById('srv-title').value = ""; document.getElementById('srv-price').value = "";
            } catch (error) {
                showToast(error.message, true); // SHOWS ERROR IN TOAST NOTIFICATION
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Upload & Publish";
            }
        }

        async function uploadGallery() {
            const fileInput = document.getElementById('gal-image');
            const titleInput = document.getElementById('gal-title').value.trim();
            const btn = document.getElementById('gal-btn');
            const spinner = document.getElementById('gal-spinner');
            const btnText = document.getElementById('gal-btn-text');

            if(!fileInput.files[0] || !titleInput) {
                showToast("Please fill all details!", true);
                return;
            }

            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Uploading to Server...";

            try {
                const imageUrl = await uploadImageToImgBB(fileInput.files[0]);
                btnText.innerText = "Saving to Database...";
                
                await db.ref('sm_events_gallery').push({
                    title: titleInput,
                    imageUrl: imageUrl,
                    timestamp: Date.now()
                });

                soundSuccess.play();
                showToast("✅ Photo added to Gallery!");
                fileInput.value = ""; document.getElementById('gal-title').value = "";
            } catch (error) {
                showToast(error.message, true);
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Upload to Gallery";
            }
        }

        function deleteItem(node, key) {
            if(confirm("Are you sure you want to delete this?")) {
                db.ref(node).child(key).remove()
                .then(() => {
                    soundDelete.play();
                    showToast("Deleted successfully!");
                })
                .catch(err => showToast("Error deleting item", true));
            }
        }

        // REALTIME DATABASE FETCH (Updates Live on Screen)
        db.ref('sm_events_services').on('value', (snapshot) => {
            const container = document.getElementById('live-services');
            container.innerHTML = '';
            if(snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    const key = child.key;
                    container.innerHTML += `
                        <div class="data-card">
                            <img src="${data.imageUrl}" alt="${data.title}">
                            <div class="data-card-info">
                                <h4>${data.title}</h4>
                                <p>${data.price}</p>
                                <button class="delete-btn" onclick="deleteItem('sm_events_services', '${key}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="color:#888;">No services uploaded yet.</p>';
            }
        });

        db.ref('sm_events_gallery').on('value', (snapshot) => {
            const container = document.getElementById('live-gallery');
            container.innerHTML = '';
            if(snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    const key = child.key;
                    container.innerHTML += `
                        <div class="data-card">
                            <img src="${data.imageUrl}" alt="${data.title}">
                            <div class="data-card-info">
                                <h4>${data.title}</h4>
                                <button class="delete-btn" style="margin-top:10px;" onclick="deleteItem('sm_events_gallery', '${key}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="color:#888;">No photos uploaded yet.</p>';
            }
        });
    </script>
</body>
</html>
