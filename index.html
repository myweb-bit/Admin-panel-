<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SM Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #800000;
            --primary-dark: #4a0000;
            --gold: #D4AF37;
            --light: #FDFBF7;
            --dark: #1A1A1A;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f6f9; color: var(--dark); padding: 20px; }

        .container { max-width: 900px; margin: auto; }

        header { background: var(--primary); color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-bottom: 4px solid var(--gold); }
        header h1 { font-size: 1.4rem; color: var(--gold); }
        .view-site-btn { background: var(--gold); color: var(--primary-dark); text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; transition: 0.3s; }
        .view-site-btn:hover { background: white; }

        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-left: 5px solid var(--primary); }
        .card h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: #555; }
        .input-group input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .input-group input:focus { border-color: var(--primary); }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; font-size: 0.95rem; }
        .btn-submit:hover { background: var(--primary-dark); }

        .items-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .item-card { border: 1px solid #eee; border-radius: 10px; overflow: hidden; background: #fafafa; position: relative; }
        .item-card img { width: 100%; height: 140px; object-fit: cover; }
        .item-card-body { padding: 10px; }
        .item-card-body h4 { font-size: 0.9rem; color: var(--dark); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-card-body p { font-size: 0.8rem; color: var(--primary); font-weight: 600; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; margin-top: 8px; width: 100%; font-weight: 500; }
        .btn-delete:hover { background: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SM Event Admin Panel</h1>
        <a href="index.html" target="_blank" class="view-site-btn">Live Site Dekhein ↗</a>
    </header>

    <!-- SIRF 3 CHEEZEIN CHANGE KARNE KA BOX -->
    <div class="card">
        <h2>⚙️ Change Email, Instagram & YouTube Links</h2>
        <div class="form-grid">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>Official Email ID</label>
                <input type="email" id="settingEmail" placeholder="infosmevent49@gmail.com">
            </div>
            <div class="input-group">
                <label>Instagram Page Link</label>
                <input type="url" id="settingInsta" placeholder="https://instagram.com/yourpage">
            </div>
            <div class="input-group">
                <label>YouTube Channel Link</label>
                <input type="url" id="settingYt" placeholder="https://youtube.com/@yourchannel">
            </div>
        </div>
        <button class="btn-submit" onclick="saveSiteLinks()">Links Save Karein (Realtime Update)</button>
    </div>

    <!-- SERVICES ADD/DELETE SECTION -->
    <div class="card">
        <h2>✨ Nayi Service Add Karein</h2>
        <div class="form-grid">
            <div class="input-group">
                <label>Service Ka Title</label>
                <input type="text" id="serviceTitle" placeholder="e.g. Royal Stage Decor">
            </div>
            <div class="input-group">
                <label>Price ya Rate</label>
                <input type="text" id="servicePrice" placeholder="e.g. Starting ₹15,000/-">
            </div>
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>Photo URL (Image Link)</label>
                <input type="url" id="serviceImg" placeholder="https://...">
            </div>
        </div>
        <button class="btn-submit" onclick="addService()">Service Add Karein</button>
        
        <h3 style="margin-top: 25px; font-size: 1rem; color: #555;">Live Services:</h3>
        <div class="items-list" id="servicesList">Loading services...</div>
    </div>

    <!-- GALLERY ADD/DELETE SECTION -->
    <div class="card">
        <h2>📸 Gallery Me Photo Add Karein</h2>
        <div class="form-grid">
            <div class="input-group">
                <label>Event / Setup Ka Naam</label>
                <input type="text" id="galleryTitle" placeholder="e.g. Grand Haldi Decor">
            </div>
            <div class="input-group">
                <label>Photo URL (Image Link)</label>
                <input type="url" id="galleryImg" placeholder="https://...">
            </div>
        </div>
        <button class="btn-submit" onclick="addGalleryItem()">Gallery Me Add Karein</button>

        <h3 style="margin-top: 25px; font-size: 1rem; color: #555;">Live Gallery Items:</h3>
        <div class="items-list" id="galleryList">Loading gallery...</div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB4TpCv-euqVOn7W_7DBPkp0AsXhkJjmk8",
        authDomain: "photoshutter-423ab.firebaseapp.com",
        databaseURL: "https://photoshutter-423ab-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "photoshutter-423ab",
        storageBucket: "photoshutter-423ab.firebasestorage.app",
        messagingSenderId: "666430892267",
        appId: "1:666430892267:web:ea1167d5ce6a6bb1b3b6ae"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. LOAD & SAVE 3 LINKS (Email, Insta, YouTube)
    const settingEmail = document.getElementById('settingEmail');
    const settingInsta = document.getElementById('settingInsta');
    const settingYt = document.getElementById('settingYt');

    db.ref('sm_site_settings').on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.email) settingEmail.value = data.email;
            if (data.instagram) settingInsta.value = data.instagram;
            if (data.youtube) settingYt.value = data.youtube;
        } else {
            settingEmail.value = "infosmevent49@gmail.com";
            settingInsta.value = "https://instagram.com";
            settingYt.value = "https://youtube.com";
        }
    });

    function saveSiteLinks() {
        const payload = {
            email: settingEmail.value.trim(),
            instagram: settingInsta.value.trim(),
            youtube: settingYt.value.trim()
        };

        db.ref('sm_site_settings').update(payload)
            .then(() => alert("✅ Email, Instagram aur YouTube links successfully save ho gaye!"))
            .catch((err) => alert("Error: " + err.message));
    }

    // 2. SERVICES LOGIC
    function addService() {
        const title = document.getElementById('serviceTitle').value.trim();
        const price = document.getElementById('servicePrice').value.trim();
        const imageUrl = document.getElementById('serviceImg').value.trim();

        if (!title || !price || !imageUrl) {
            alert("Kripya title, price aur image link teeno bharein!");
            return;
        }

        db.ref('sm_events_services').push({ title, price, imageUrl })
            .then(() => {
                document.getElementById('serviceTitle').value = '';
                document.getElementById('servicePrice').value = '';
                document.getElementById('serviceImg').value = '';
                alert("✅ Service add ho gayi!");
            })
            .catch(err => alert("Error: " + err.message));
    }

    db.ref('sm_events_services').on('value', (snapshot) => {
        const container = document.getElementById('servicesList');
        container.innerHTML = '';
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const item = child.val();
                const key = child.key;
                container.innerHTML += `
                    <div class="item-card">
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div class="item-card-body">
                            <h4>${item.title}</h4>
                            <p>${item.price}</p>
                            <button class="btn-delete" onclick="deleteItem('sm_events_services', '${key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = '<p style="color:#888;">Koi service nahi hai.</p>';
        }
    });

    // 3. GALLERY LOGIC
    function addGalleryItem() {
        const title = document.getElementById('galleryTitle').value.trim();
        const imageUrl = document.getElementById('galleryImg').value.trim();

        if (!title || !imageUrl) {
            alert("Kripya title aur image link dono bharein!");
            return;
        }

        db.ref('sm_events_gallery').push({ title, imageUrl })
            .then(() => {
                document.getElementById('galleryTitle').value = '';
                document.getElementById('galleryImg').value = '';
                alert("✅ Gallery photo add ho gayi!");
            })
            .catch(err => alert("Error: " + err.message));
    }

    db.ref('sm_events_gallery').on('value', (snapshot) => {
        const container = document.getElementById('galleryList');
        container.innerHTML = '';
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const item = child.val();
                const key = child.key;
                container.innerHTML += `
                    <div class="item-card">
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div class="item-card-body">
                            <h4>${item.title}</h4>
                            <button class="btn-delete" onclick="deleteItem('sm_events_gallery', '${key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = '<p style="color:#888;">Koi photo nahi hai.</p>';
        }
    });

    // SILENT DELETE FUNCTION (Koi khatarnaak awaaz ya audio code nahi bacha)
    function deleteItem(node, key) {
        if (confirm("Kya aap ise delete karna chahte hain?")) {
            db.ref(node).child(key).remove()
                .catch(err => alert("Error: " + err.message));
        }
    }
</script>
</body>
</html>
